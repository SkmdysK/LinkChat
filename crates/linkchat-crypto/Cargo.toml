[package]
name = "linkchat-crypto"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = { version = "0.4.0", features = ["sys_rng"] }
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
kem = { version = "0.3.0", default-features = false }
ml-kem = { version = "0.3.2", default-features = false, features = ["zeroize"] }
rand_core = "0.10.1"
sha2 = { version = "0.11.0", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8.0", features = ["derive"] }

linkchat-types = { path = "../linkchat-types" }
